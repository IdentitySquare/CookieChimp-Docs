        List the account's website scans, newest first. Requires an
        account-scoped API token.
      operationId: listScans
      tags:
        - Scans
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: "#/components/schemas/BasePagination"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Scan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      parameters:
        - $ref: "#/components/parameters/account_id"
      summary: Start a scan
      description: |
        Queue a scan of the account's website. Only one scan can run at a time
        per account, and accounts have a daily scan limit — both come back as a
        `422`, as does a mobile app account, which has no website to crawl.

        Scanning is asynchronous: the scan is created `queued`, and the report
        appears on the scan once its status reaches `completed`.
      operationId: createScan
      tags:
        - Scans
      requestBody:
        description: Scan to queue
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanWriteRequest"
      responses:
        "201":
          description: Queued scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "400":
          $ref: "#/components/responses/AmbiguousAccount"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "403":
          $ref: "#/components/responses/AccountAdminRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /scans/{id}:
    get:
      summary: Get scan
      description: |
        Get a scan by ID. `report` is only present once the scan has completed;
        poll `status` until then.
      operationId: getScan
      tags:
        - Scans
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResponse"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # compliance report
  /compliance:
    get:
      parameters:
        - $ref: "#/components/parameters/account_id"
      summary: Get the regional compliance report
      description: |
        Evaluate the account's banners against every regulation CookieChimp
        tracks, and report what is outstanding — the same evaluation the
        dashboard's compliance screen renders.

        Regulations the account has chosen to ignore are reported separately in
        `ignored_jurisdictions` rather than dropped, and are excluded from the
        top-level `compliant` verdict.

        Requires a plan that includes the compliance report.
      operationId: getComplianceReport
      tags:
        - Compliance
      responses:
        "200":
          description: The compliance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReportResponse"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "403":
          description: The account's plan does not include the compliance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errors:
                  - code: 403
                    message: "The compliance report is not available on this plan"
        "429":
          $ref: "#/components/responses/RateLimited"

  # banner templates
  /banner-templates:
    get:
      parameters:
        - $ref: "#/components/parameters/account_id"
      summary: List banner templates
      description: |
        The jurisdiction templates a banner can be created from, grouped by
        region. Use a template's `id` as the `jurisdiction_id` for
        `POST /consent-banners/from-template`.
      operationId: listBannerTemplates
      tags:
        - Consent Banners
      responses:
        "200":
          description: Templates grouped by region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerTemplatesResponse"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "429":
          $ref: "#/components/responses/RateLimited"

  /consent-banners/from-template:
    post:
      parameters:
        - $ref: "#/components/parameters/account_id"
      summary: Create consent banner from a template
      description: |
        Create a banner preconfigured for a jurisdiction — the consent mode,
        targeting and copy that regulation requires. As with every banner this
        API creates, it starts disabled.

        `jurisdiction_id` comes from `GET /banner-templates`.
      operationId: createConsentBannerFromTemplate
      tags:
        - Consent Banners
      requestBody:
        description: The jurisdiction to build the banner for
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerFromTemplateRequest"
      responses:
        "201":
          description: The created consent banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentBannerResponse"
        "400":
          $ref: "#/components/responses/AmbiguousAccount"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "403":
          $ref: "#/components/responses/AccountAdminRequired"
        "404":
          description: No template exists for that `jurisdiction_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      description: API token obtained from the login endpoint or the dashboard

  parameters:
    account_id:
      name: account_id
      in: query
      description: |
        Which account to act on, as the account's API id. Only meaningful for a
        user API key, which may reach several accounts — an account key already
        identifies exactly one and ignores this.

        Accepted by the endpoints that declare it; others act on the account the
        key resolves to on its own.

        Optional for reads, where it narrows the request to that account.
        Required for writes when the key can reach more than one account:
        without it the request would act on an account it picked rather than one
        you named, so it is refused with a `400`.
      required: false
      schema:
        type: string
    id:
      name: id
      in: path
      description: ID of the resource
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: |
        Page number. Must be a positive integer; anything else returns a `400`.
        Requesting a page past the end returns the last page.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      description: |
        Number of records to return per page. The effective range is 1–50; any
        value outside it is accepted but falls back to the default of 20.
      required: false
      schema:
        type: integer
        default: 20
    onboarding_status:
      name: onboarding_status
      in: query
      description: |
        The status of the account, where:
        - `account_created`: The account has been created.
        - `vendors_setup`: Categories, services or TCF vendors have been set up.
        - `code_installed`: The script has been installed on the user's website.
        - `inactive`: Less than 10 visitors to the user's website in the last 30 days.
        - `live`: The account is live and operational.
      required: false
      schema:
        type: string
        enum: [account_created, vendors_setup, code_installed, inactive, live]
    visitor_stats:
      name: visitor_stats
      in: query
      description: |
        Set to `false` to skip resolving analytics and return `visitor_stats` as
        `null`. Useful when you only need the account list, as it avoids the
        analytics lookup entirely.
      required: false
      schema:
        type: boolean
        default: true

  responses:
    BadRequest:
      description: Invalid pagination parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 400
                message: "Invalid page parameter"

    Unauthorized:
      description: Missing, invalid or expired API token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 401
                message: "Invalid API Key"

    AccountTokenRequired:
      description: |
        Missing or invalid API token, or a token that does not resolve to an
        account. Account-scoped endpoints accept an account token, or a user
        token whose user belongs to an account; partner tokens are rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 401
                message: "API key must belong to an account"

    PartnerTokenRequired:
      description: Missing or invalid API token, or a token that does not belong to a partner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 401
                message: "API key must belong to a partner"

    AmbiguousAccount:
      description: |
        A user API key that can reach more than one account attempted a write
        without saying which account it meant. Pass `account_id` (the account's
        API id) as a query parameter. Account keys are never ambiguous.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 400
                message: "Specify account_id when the API key can access more than one account"

    AccountAdminRequired:
      description: |
        The token resolved to a user who is not an admin of this account.
        Configuration changes are admin-only, mirroring the dashboard — a group
        admin qualifies even without a direct membership, since a group role
        supersedes one. Account tokens carry the account's own authority and
        never see this; reads are unaffected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 403
                message: "User must be an admin of this account"

    NotFound:
      description: The record does not exist, or does not belong to the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 404
                message: "Record not found"

    RateLimited:
      description: |
        Too many requests. The general limit is 300 requests per 5 minutes per
        API token; the auth endpoints are throttled more tightly per IP.
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            errors:
              - code: 429
                message: "Too many requests. Please retry later."

    ValidationError:
      description: The record could not be saved
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    ModelValidationError:
      description: The record could not be saved
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelValidationError"

  schemas:
    Error:
      type: object
      description: |
        The standard error envelope, used for authentication, authorization,
        pagination and not-found errors.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
              message:
                type: string
      example:
        errors:
          - code: 401
            message: "Invalid API Key"

    ValidationError:
      type: object
      description: |
        Returned when a create or update fails validation. Each entry carries a
        single human-readable `error` string.
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              error:
                type: string
      example:
        errors:
          - error: "Name can't be blank"

    ModelValidationError:
      type: object
      description: |
        Returned by group create/update and account-user update, which render
        the model's errors directly: an object keyed by attribute name. Other
        validation failures — including removing an account owner — use
        `ValidationError`.
      additionalProperties:
        type: array
        items:
          type: string
      example:
        name: ["can't be blank"]
        external_id: ["has already been taken"]

    MessageError:
      type: object
      description: Returned by the auth and password endpoints, which use a single `error` string.
      properties:
        error:
          type: string
      example:
        error: "Invalid Email or password."

    DeletedMessage:
      type: object
      properties:
        message:
          type: string
      example:
        message: "Record was deleted successfully"

    BasePagination:
      type: object
      properties:
        prev_url:
          type: string
          description: Path to get the previous page
        next_url:
          type: string
          description: Path to get the next page
        count:
          type: integer
          description: Total number of records across all pages
        page:
          type: integer
          description: Current page
        prev:
          type: [integer, "null"]
          description: Previous page number, or null on the first page
        next:
