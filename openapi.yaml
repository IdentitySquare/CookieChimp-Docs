      summary: Create service
      description: |
        Create a service under one of the account's categories. `category_id`
        is required and must belong to this account.
      operationId: createService
      tags:
        - Services
      requestBody:
        description: Service to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteServiceCreateRequest"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteServiceResponse"
        "400":
          $ref: "#/components/responses/AmbiguousAccount"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "403":
          $ref: "#/components/responses/AccountAdminRequired"
        "404":
          description: The referenced `category_id` does not belong to this account
          content:
