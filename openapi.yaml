                  pagination:
                    $ref: "#/components/schemas/BasePagination"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      parameters:
