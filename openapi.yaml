              type: [string, "null"]
            name:
              type: [string, "null"]
        service:
          type: object
          description: The service this item belongs to, if any
          properties:
            id:
              type: [string, "null"]
            name:
              type: [string, "null"]
        description:
          type: string
        company_name:
          type: string
        duration:
          type: string
        domain:
          type: string
        partitioned:
          type: boolean
        path:
