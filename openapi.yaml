          description: Percentage change against the comparison period

    VisitorStatsRawMetric:
      type: object
      properties:
        current_period:
          type: number
        previous_period:
          type: number

    VisitorStats:
      type: [object, "null"]
      description: |
        Visitor analytics for the last 30 days, compared against the 30 days
        before that. `null` when the client passed `?visitor_stats=false`.
      properties:
        comparison:
          type: string
          description: Label for the comparison period
        statistics:
          type: object
          properties:
            consents:
              $ref: "#/components/schemas/VisitorStatsMetric"
            unique_visitors:
              $ref: "#/components/schemas/VisitorStatsMetric"
            consent_rate:
              $ref: "#/components/schemas/VisitorStatsMetric"
        raw_data:
          type: object
          properties:
            consents:
              $ref: "#/components/schemas/VisitorStatsRawMetric"
            unique_visitors:
              $ref: "#/components/schemas/VisitorStatsRawMetric"
            consent_rate:
              $ref: "#/components/schemas/VisitorStatsRawMetric"

    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier for the account
        name:
          type: string
          readOnly: true
          description: Domain of the account
        allowed_domains:
          type: array
          items:
            type: string
          readOnly: true
          description: List of allowed domains the script will run on
        owner_id:
          type: string
          readOnly: true
          description: ID of the account user that owns the account
        onboarding_status:
          type: string
          readOnly: true
          description: |
            The status of the account, where:
            - `account_created`: The account has been created.
            - `vendors_setup`: Categories, services or TCF vendors have been set up.
            - `code_installed`: The script has been installed on the user's website.
            - `inactive`: Less than 10 visitors to the user's website in the last 30 days.
            - `live`: The account is live and operational.
        visitor_stats:
          $ref: "#/components/schemas/VisitorStats"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the account was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the account was last updated
