        before that. `null` when the client passed `?visitor_stats=false`.
      properties:
        comparison:
          type: string
          description: Label for the comparison period
        statistics:
          type: object
          properties:
            consents:
              $ref: "#/components/schemas/VisitorStatsMetric"
            unique_visitors:
              $ref: "#/components/schemas/VisitorStatsMetric"
            consent_rate:
              $ref: "#/components/schemas/VisitorStatsMetric"
        raw_data:
          type: object
          properties:
            consents:
              $ref: "#/components/schemas/VisitorStatsRawMetric"
            unique_visitors:
              $ref: "#/components/schemas/VisitorStatsRawMetric"
            consent_rate:
              $ref: "#/components/schemas/VisitorStatsRawMetric"

    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier for the account
        name:
          type: string
          readOnly: true
          description: Domain of the account
        allowed_domains:
          type: array
          items:
            type: string
          readOnly: true
          description: List of allowed domains the script will run on
        owner_id:
          type: string
          readOnly: true
          description: ID of the account user that owns the account
        onboarding_status:
          type: string
          readOnly: true
          description: |
            The status of the account, where:
            - `account_created`: The account has been created.
            - `vendors_setup`: Categories, services or TCF vendors have been set up.
            - `code_installed`: The script has been installed on the user's website.
            - `inactive`: Less than 10 visitors to the user's website in the last 30 days.
            - `live`: The account is live and operational.
        visitor_stats:
          $ref: "#/components/schemas/VisitorStats"
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the account was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the account was last updated
      example:
        id: "abc123"
        name: "example.com"
        allowed_domains: ["example.net", "example.org"]
        owner_id: "xyz123"
        onboarding_status: "live"
        visitor_stats:
          comparison: "vs. Last 30 days"
          statistics:
            consents:
              count: 213
              rate_of_change: 25.29
            unique_visitors:
              count: 895
              rate_of_change: 42.06
            consent_rate:
              count: 23.8
              rate_of_change: -11.85
          raw_data:
            consents:
              current_period: 213
              previous_period: 170
            unique_visitors:
              current_period: 895
              previous_period: 630
            consent_rate:
              current_period: 23.8
              previous_period: 27.0
        created_at: "2022-12-20T18:45:00Z"
        updated_at: "2023-01-10T19:00:00Z"

    AccountWrite:
      type: object
      properties:
        name:
          type: string
          description: |
            The account's domain. Must be a valid domain for website accounts.
        domain:
          type: string
        subdomain:
          type: string
        default_language:
          type: string
          description: ISO 639-1 code the banner falls back to
        auto_translate:
          type: boolean
          description: Whether new content is machine-translated into the account's languages
        translations:
          type: array
          items:
            type: string
          description: ISO 639-1 codes the banner is translated into
        allowed_domains_list:
          type: string
          description: Comma-separated list of domains the script may run on
        industry:
          type: string
        description:
          type: string
        support_email:
          type: string
          format: email
        banner_debug_mode:
          type: boolean
        blocking_mode:
          type: string
          description: How aggressively scripts are blocked before consent
        retain_consent_duration:
          type: integer
          description: |
            Years consent records are retained. Free accounts are fixed at 3.

    AccountWriteRequest:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/AccountWrite"
      required:
        - account
      example:
        account:
          name: "example.com"
          support_email: "privacy@example.com"
          banner_debug_mode: false

    SiteServiceWrite:
      type: object
      properties:
        name:
          type: string
          description: Name of the service, shown to visitors
        category_id:
          type: string
          description: |
            ID of the category the service belongs to. Required on create;
            on update, supplying it moves the service to that category.
        description:
          type: string
          description: Description shown to visitors
        processing_company:
          type: string
          description: Company that processes data through this service
        privacy_policy_url:
          type: string
        additional_info:
          type: string
        accepted_by_default:
          type: boolean
          description: Whether the service is pre-accepted in the banner
        enabled:
          type: boolean
          description: Whether the service is active on the account
        auto_block:
          type: boolean
          description: Whether the widget blocks this service's scripts before consent
        auto_block_domains_input:
          type: string
          description: |
            Domains to auto-block, separated by commas or newlines. Parsed into
            the `auto_block_domains` list on save.

    SiteServiceCreate:
      description: |
        A service is always filed under a category, so `category_id` is
        required here even though it is optional when updating.
      allOf:
        - $ref: "#/components/schemas/SiteServiceWrite"
      required:
        - name
        - category_id

    SiteServiceCreateRequest:
      type: object
      properties:
        site_service:
          $ref: "#/components/schemas/SiteServiceCreate"
      required:
        - site_service
      example:
        site_service:
          name: "Google Analytics"
          category_id: "cat1"
          processing_company: "Google LLC"
          privacy_policy_url: "https://policies.google.com/privacy"
          auto_block: true

    SiteServiceUpdateRequest:
      type: object
      description: |
        Every field is optional; anything omitted keeps its current value.
        Supplying `category_id` moves the service to that category.
      properties:
        site_service:
          $ref: "#/components/schemas/SiteServiceWrite"
      required:
        - site_service
      example:
        site_service:
          name: "Google Analytics 4"
          auto_block: false

    SiteService:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: [string, "null"]
        processing_company:
          type: [string, "null"]
        privacy_policy_url:
          type: [string, "null"]
        additional_info:
          type: [string, "null"]
        accepted_by_default:
          type: boolean
        enabled:
          type: boolean
        auto_block:
          type: boolean
        auto_block_domains:
          type: array
          items:
            type: string
          description: Domains the widget blocks for this service before consent
        default_language:
          type: [string, "null"]
        category:
          type: object
          description: The category this service is filed under
          properties:
            id:
              type: [string, "null"]
            name:
              type: [string, "null"]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: "svc1"
        name: "Google Analytics"
        description: "Measures how visitors use the site."
        processing_company: "Google LLC"
        privacy_policy_url: "https://policies.google.com/privacy"
        additional_info: null
        accepted_by_default: false
        enabled: true
        auto_block: true
        auto_block_domains: ["google-analytics.com"]
        default_language: "en"
        category:
          id: "cat1"
          name: "Analytics"
        created_at: "2023-03-01T09:00:00Z"
        updated_at: "2023-03-23T12:34:56Z"

    SiteServiceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SiteService"

    ConsentBannerWrite:
      type: object
      description: |
        The banner attributes the dashboard's banner designer can set. The full
        set is large; the commonly used ones are listed here, and any other
        attribute the designer exposes is accepted too.
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: Whether the banner is live. New banners are always created disabled.
        enable_tcf:
          type: boolean
          description: Whether the banner runs in IAB TCF mode
        force_consent:
          type: boolean
          description: Whether the page is blocked until the visitor chooses
        consent_mode:
          type: string
          description: e.g. `opt_in`, `opt_out`
        consent_duration_days:
          type: integer
          description: How long a visitor's choice is remembered
        consent_layout:
          type: string
          description: e.g. `box`, `bar`
        consent_position:
          type: string
          description: e.g. `bottom_center`
        consent_title:
          type: string
        consent_description:
          type: string
        privacy_policy_url:
          type: string
        preferences_control_level:
          type: string
          description: How granular the preferences modal is
        dark_mode:
          type: string
          description: e.g. `light`, `dark`, `auto`
        language_autodetect:
          type: string
        target_type:
          type: string
          description: Who sees the banner, e.g. `worldwide`, `selected_countries`
        target_countries:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 codes
        target_us_states:
          type: array
          items:
            type: string
        target_canadian_regions:
          type: array
          items:
            type: string
          description: |
            Province and territory codes, used when `target_type` is
            `selected_canadian_provinces`.
        banner_languages_attributes:
          type: object
          description: |
            Create, update or discard translations. Not accepted when creating a
            banner — add them by updating it, which is where the account's
            language entitlement is enforced.

            Keys are arbitrary indices. Omit `id` to add a translation; pass the
            `id` from the banner's `translations` array to change an existing
            one, and set `discarded_at` to remove it.
          additionalProperties:
            type: object
            properties:
              id:
                type: string
                description: From the banner's `translations` array
              language_code:
                type: string
                description: ISO 639-1 code
              consent_title:
                type: string
              consent_description:
                type: string
              banner_accept_btn_text:
                type: string
              banner_accept_necessary_btn_text:
                type: string
              banner_preferences_btn_text:
                type: string
              settings_title:
                type: string
              settings_description:
                type: string
              privacy_policy_url:
                type: string
              save_preferences_btn_text:
                type: string
              discarded_at:
                type: [string, "null"]
                format: date-time
                description: Set to remove this translation

    ConsentBannerWriteRequest:
      type: object
      properties:
        consent_banner:
          $ref: "#/components/schemas/ConsentBannerWrite"
      required:
        - consent_banner
      example:
        consent_banner:
          name: "EU banner"
          consent_title: "We use cookies"
          consent_mode: "opt_in"
          target_type: "selected_countries"
          target_countries: ["DE", "FR"]

    ConsentBanner:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        enabled:
          type: boolean
        enable_tcf:
          type: boolean
        force_consent:
          type: boolean
        consent_mode:
          type: string
        consent_duration_days:
          type: integer
        consent_layout:
          type: string
        consent_position:
          type: string
        consent_title:
          type: [string, "null"]
        consent_description:
          type: [string, "null"]
        privacy_policy_url:
          type: [string, "null"]
        preferences_control_level:
          type: string
        dark_mode:
          type: string
        language_autodetect:
          type: string
        revision:
          type: integer
          readOnly: true
          description: Bumped when a change requires visitors to consent again
        targeting:
          type: object
          properties:
            target_type:
              type: string
            target_countries:
              type: array
              items:
                type: string
            target_us_states:
              type: array
              items:
                type: string
            target_canadian_regions:
              type: array
              items:
                type: string
              description: |
                Populated instead of `target_us_states` when `target_type` is
                `selected_canadian_provinces`; the two share a column.
        translations:
          type: array
          readOnly: true
          description: |
            The banner's translations. The `id` is what you send back in
            `banner_languages_attributes` to update or discard one.
          items:
            type: object
            properties:
              id:
                type: string
              language_code:
                type: string
                description: ISO 639-1 code
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: "ban1"
        name: "EU banner"
        enabled: true
        enable_tcf: false
        force_consent: false
        consent_mode: "opt_in"
        consent_duration_days: 180
        consent_layout: "box"
        consent_position: "bottom_center"
        consent_title: "We use cookies"
        consent_description: "We use cookies to improve your experience."
        privacy_policy_url: "https://example.com/privacy"
        preferences_control_level: "category_and_services"
        dark_mode: "light"
        language_autodetect: "document"
        revision: 2
        targeting:
          target_type: "selected_countries"
          target_countries: ["DE", "FR"]
          target_us_states: []
        translations:
          - id: "trn1"
            language_code: "de"
          - id: "trn2"
            language_code: "fr"
        created_at: "2023-01-05T10:15:30Z"
        updated_at: "2023-02-01T08:00:00Z"

    ConsentBannerResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ConsentBanner"

    IntegrationWrite:
      type: object
      description: |
        `status` applies to every integration. The remaining keys are only
        accepted by the integration that declares them; anything else is ignored.
      properties:
        status:
          type: string
          enum: [active, inactive]
        scan_frequency:
          type: string
          enum: [weekly, monthly]
          description: |
            `SiteScanIntegration` only. Weekly is not available on free accounts.
        auto_add_vendors:
          type: boolean
          description: "`SiteScanIntegration` only: add vendors a scan discovers."
        url_passthrough:
          type: boolean
          description: "`GoogleConsentModeIntegration` only."
        ads_data_redaction:
          type: boolean
          description: "`GoogleConsentModeIntegration` only."

    IntegrationWriteRequest:
      type: object
      properties:
        integration:
          $ref: "#/components/schemas/IntegrationWrite"
      required:
        - integration
      example:
        integration:
          status: "active"
          scan_frequency: "monthly"
          auto_add_vendors: true

    Integration:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
          description: The integration class, e.g. `SiteScanIntegration`
        name:
          type: string
          readOnly: true
          description: Human-readable name
        status:
          type: string
          enum: [active, inactive]
        short_description:
          type: [string, "null"]
          readOnly: true
        settings:
          type: [object, "null"]
          additionalProperties: true
          description: Integration-specific settings
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: "int1"
        type: "SiteScanIntegration"
        name: "Site Scan"
        status: "active"
        short_description: "Scan your website for cookies on a schedule."
        settings:
          scan_frequency: "monthly"
          auto_add_vendors: false
        created_at: "2023-01-05T10:15:30Z"
        updated_at: "2023-02-01T08:00:00Z"

    IntegrationResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Integration"

    ScanWrite:
      type: object
      properties:
        starting_url:
          type: string
          description: |
            URL the crawl starts from. A missing scheme is treated as `https://`.
            Defaults to the account's own domain when omitted.
        max_pages:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum pages to crawl
        crawl_subdomains:
          type: boolean
          description: Whether the crawl follows links onto subdomains

    ScanWriteRequest:
      type: object
      properties:
        scan:
          $ref: "#/components/schemas/ScanWrite"
      required:
        - scan
      example:
        scan:
          starting_url: "https://example.com"
          max_pages: 25
          crawl_subdomains: false

    Scan:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        status:
          type: string
          enum: [queued, in_progress, completed, failed]
          readOnly: true
        starting_url:
          type: string
        domain:
          type: string
          readOnly: true
          description: Host derived from `starting_url`, without a `www.` prefix
        max_pages:
          type: [integer, "null"]
        crawl_subdomains:
          type: boolean
        response_code:
          type: [string, "null"]
          readOnly: true
        report:
          type: object
          readOnly: true
          description: |
            Only present once `status` is `completed`. Storage items found
            before and after consent, grouped by vendor and storage type.
          properties:
            before_consent:
              type: object
              additionalProperties: true
            after_consent:
              type: object
              additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: "scn1"
        status: "queued"
        starting_url: "https://example.com"
        domain: "example.com"
        max_pages: 25
        crawl_subdomains: false
        response_code: null
        created_at: "2023-03-01T09:00:00Z"
        updated_at: "2023-03-01T09:00:00Z"

    ScanResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Scan"

    ComplianceJurisdiction:
      type: object
      properties:
        id:
          type: string
          description: Identifier for the regulation, e.g. `gdpr`
        name:
          type: string
        region:
          type: string
        flag:
          type: [string, "null"]
        applicability:
          type: [string, "null"]
          description: Who the regulation applies to
        legal_refs:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: true
        compliant:
          type: boolean
          description: Whether the banner covering this regulation satisfies it
        issues:
          type: array
          description: Requirements not currently met
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          description: Things worth attention that do not by themselves fail the check
          items:
            type: object
            additionalProperties: true
        compliant_items:
          type: array
          description: Requirements already satisfied
          items:
            type: object
            additionalProperties: true
        matched_region:
          type: [string, "null"]
          description: The targeted region that caused this banner to be selected
        banner:
          type: object
          description: |
            The banner evaluated for this regulation. Both fields are null when
            no banner targets it, which is itself a compliance issue.
          properties:
            id:
              type: [string, "null"]
            name:
              type: [string, "null"]

    ComplianceReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            compliant:
              type: boolean
              description: |
                True when every regulation not ignored is satisfied.
            jurisdictions:
              type: array
              items:
                $ref: "#/components/schemas/ComplianceJurisdiction"
            ignored_jurisdictions:
              type: array
              description: |
                Regulations the account has chosen to ignore. Reported so a
                client can see what was excluded from `compliant`.
              items:
                $ref: "#/components/schemas/ComplianceJurisdiction"

    BannerTemplate:
      type: object
      properties:
        id:
          type: string
          description: Pass as `jurisdiction_id` when creating a banner
        name:
          type: string
        flag:
          type: [string, "null"]
        consent_type:
          type: string
          description: e.g. `opt_in`, `opt_out`
        consent_type_label:
          type: string
          description: e.g. `Opt-in`

    BannerTemplatesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              region:
                type: string
              region_label:
                type: string
              templates:
                type: array
                items:
                  $ref: "#/components/schemas/BannerTemplate"
      example:
        data:
          - region: "europe"
            region_label: "Europe"
            templates:
              - id: "gdpr"
                name: "GDPR"
                flag: "🇪🇺"
                consent_type: "opt_in"
                consent_type_label: "Opt-in"

    BannerFromTemplateRequest:
      type: object
      properties:
        jurisdiction_id:
          type: string
          description: A template `id` from `GET /banner-templates`
      required:
        - jurisdiction_id
      example:
        jurisdiction_id: "gdpr"

security:
  - authorization: []
