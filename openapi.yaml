    get:
      summary: List integrations
      description: |
        List every integration available to the account, active and inactive.
        Integrations the account has never opened are created inactive on first
        listing, so the collection is always the full set you can enable.

        Only integrations the account's platform can run are included — a mobile
        app account does not see the website-only ones.
      operationId: listIntegrations
      tags:
        - Integrations
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: "#/components/schemas/BasePagination"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Integration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "429":
          $ref: "#/components/responses/RateLimited"

  /integrations/{id}:
    get:
      summary: Get integration
      description: Get integration by ID
      operationId: getIntegration
      tags:
        - Integrations
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResponse"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    put:
      summary: Update integration
      description: |
        Enable, disable or configure an integration. Every integration accepts
        `status`; the rest of the accepted keys depend on which integration it
        is, and anything else is ignored.

        - `SiteScanIntegration` also accepts `scan_frequency` (`weekly` or
          `monthly`; weekly is not available on free accounts) and
          `auto_add_vendors`.
        - `GoogleConsentModeIntegration` also accepts `url_passthrough` and
          `ads_data_redaction`.

        Enabling an integration may add its associated vendors to the account.
      operationId: updateIntegration
      tags:
        - Integrations
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/id"
      requestBody:
        description: Integration settings to update
        required: true
        content:
