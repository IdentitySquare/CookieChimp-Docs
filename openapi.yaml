        "403":
          $ref: "#/components/responses/AccountAdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # consent banner endpoints - index, GET, POST, PUT, DELETE & duplicate
  /consent-banners:
    get:
      summary: List consent banners
      description: |
        List the account's consent banners, newest first. Requires an
        account-scoped API token.
      operationId: listConsentBanners
      tags:
        - Consent Banners
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/page"
      responses:
        "200":
          description: List of consent banners
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagination:
                    $ref: "#/components/schemas/BasePagination"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentBanner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      parameters:
        - $ref: "#/components/parameters/account_id"
      summary: Create consent banner
      description: |
        Create a consent banner. It inherits the design of the account's most
        recently updated banner, the same way the dashboard's new-banner flow
        does, and is always created disabled — enable it once its content and
        targeting are set. A name is generated if you don't supply one.

        Translations are not accepted here; add them by updating the banner
        afterwards, which is where the account's language entitlement is
        enforced.
      operationId: createConsentBanner
      tags:
        - Consent Banners
      requestBody:
        description: Consent banner to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentBannerWriteRequest"
      responses:
        "201":
          description: Created consent banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentBannerResponse"
        "400":
          $ref: "#/components/responses/AmbiguousAccount"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "403":
          $ref: "#/components/responses/AccountAdminRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /consent-banners/{id}:
    get:
      summary: Get consent banner
      description: Get consent banner by ID
      operationId: getConsentBanner
      tags:
        - Consent Banners
      parameters:
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Consent banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentBannerResponse"
        "401":
          $ref: "#/components/responses/AccountTokenRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    put:
      summary: Update consent banner
      description: |
        Update a consent banner's content, appearance or targeting. Set
        `enabled` to `true` to make it live.
      operationId: updateConsentBanner
      tags:
