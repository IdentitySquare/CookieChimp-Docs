      type: object
      properties:
        storage_item:
          $ref: "#/components/schemas/StorageItemWrite"
      required:
        - storage_item
      example:
        storage_item:
          name: "_ga"
          storage_type: "cookie"
          description: "Used to distinguish users."
          company_name: "Google"
          domain: ".example.com"
          duration: "2 years"
          partitioned: false
          path: "/"
          samesite: "lax"
          category_id: "cat1"

    StorageItem:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Unique identifier for the storage item
        name:
          type: string
        storage_type:
          type: string
          enum: [cookie, local_storage, session_storage]
        category:
          type: object
          description: |
            The category this item is filed under. Falls back to the category of
            the item's service when the item has no category of its own.
          properties:
            id:
              type: [string, "null"]
            name:
              type: [string, "null"]
        service:
          type: object
          description: The service this item belongs to, if any
          properties:
            id:
              type: [string, "null"]
            name:
              type: [string, "null"]
        description:
          type: string
        company_name:
          type: string
        duration:
          type: string
        domain:
          type: string
        partitioned:
          type: boolean
        path:
          type: string
        samesite:
          type: [string, "null"]
          enum: [lax, strict, null]
        wildcard_id:
          type: [string, "null"]
          readOnly: true
          description: ID of the wildcard item this one was matched against, if any
        default_language:
          type: string
          description: Language code the name and description are written in
        last_seen_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: When this item was last observed on the website
        created_by:
          type: string
          enum: [user, scan]
          readOnly: true
          description: Whether the item was added by a user or found by a scan
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      example:
        id: "sto123"
        name: "_ga"
        storage_type: "cookie"
        category:
          id: "cat1"
          name: "Analytics"
        service:
          id: "svc1"
          name: "Google Analytics"
        description: "Used to distinguish users."
        company_name: "Google"
        duration: "2 years"
        domain: ".example.com"
        partitioned: false
        path: "/"
        samesite: "lax"
        wildcard_id: null
        default_language: "en"
        last_seen_at: "2023-03-23T12:34:56Z"
        created_by: "scan"
        created_at: "2023-03-01T09:00:00Z"
        updated_at: "2023-03-23T12:34:56Z"

